<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estúdio – Agora FM 92,5</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --roxo:#4B2D8B;--roxo-escuro:#351f63;--roxo-claro:#6B4DBF;
    --roxo-bg:#f4f0ff;--branco:#fff;--cinza-claro:#f7f7f9;
    --cinza-borda:#e2dff0;--texto:#1a1525;--texto-leve:#6b6580;
    --verde:#1db77d;--vermelho:#e53e3e;--amarelo:#f6ad0a;
    --laranja:#f97316;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--cinza-claro);color:var(--texto);min-height:100vh;}
  .header{background:linear-gradient(135deg,var(--roxo-escuro) 0%,var(--roxo) 60%,var(--roxo-claro) 100%);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:68px;box-shadow:0 2px 16px rgba(75,45,139,.35);position:sticky;top:0;z-index:100;}
  .header img{height:46px;}
  .header-center{text-align:center;}
  .header-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:#fff;letter-spacing:1.5px;text-transform:uppercase;}
  .header-sub{font-size:11px;color:rgba(255,255,255,.7);font-weight:500;letter-spacing:.5px;}
  .badge-ao-vivo{background:#e53e3e;color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;letter-spacing:.5px;display:flex;align-items:center;gap:6px;animation:pulse-red 2s ease-in-out infinite;}
  @keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(229,62,62,.4);}50%{box-shadow:0 0 0 8px rgba(229,62,62,0);}}
  .dot-vivo{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  .main{max-width:1200px;margin:0 auto;padding:28px 20px;}
  .semana-bar{background:linear-gradient(135deg,var(--roxo) 0%,var(--roxo-claro) 100%);color:#fff;border-radius:12px;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
  .semana-bar .sb-label{font-size:11px;opacity:.75;font-weight:600;letter-spacing:1px;text-transform:uppercase;}
  .semana-bar .sb-date{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;}
  .sb-count{background:rgba(255,255,255,.2);padding:6px 16px;border-radius:20px;font-size:14px;font-weight:700;}
  .grid-premios{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;}
  .card-premio{background:var(--branco);border-radius:16px;border:1px solid var(--cinza-borda);overflow:hidden;box-shadow:0 2px 8px rgba(75,45,139,.06);transition:transform .2s,box-shadow .2s;position:relative;}
  .card-premio:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(75,45,139,.12);}
  .card-premio.sorteado{opacity:.65;border-color:#bbb;}
  .card-premio.sorteado .cp-status-bar{background:var(--verde);}
  .cp-status-bar{height:5px;background:var(--roxo);}
  .card-premio.disponivel .cp-status-bar{background:var(--roxo);}
  .card-premio.sorteado .cp-status-bar{background:var(--verde);}
  .cp-head{padding:16px 20px 12px;border-bottom:1px solid var(--cinza-borda);}
  .cp-programa{font-size:11px;font-weight:700;color:var(--roxo);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .cp-nome{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--texto);line-height:1.2;}
  .cp-body{padding:14px 20px;}
  .cp-info{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .cp-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--texto-leve);}
  .cp-row span{font-weight:600;color:var(--texto);}
  .cp-icon{font-size:15px;width:20px;text-align:center;}
  .chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;}
  .chip-disponivel{background:var(--roxo-bg);color:var(--roxo);}
  .chip-sorteado{background:#e8fdf4;color:#1a8a5a;}
  .chip-entregue{background:#fff8e1;color:#b37700;}
  .cp-ganhador{background:#e8fdf4;border-radius:10px;padding:12px 16px;margin-bottom:14px;}
  .cp-ganhador-label{font-size:11px;font-weight:700;color:#1a8a5a;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .cp-ganhador-nome{font-weight:700;color:var(--texto);font-size:14px;}
  .cp-ganhador-tel{font-size:13px;color:var(--texto-leve);}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;width:100%;justify-content:center;}
  .btn-sortear{background:linear-gradient(135deg,var(--roxo) 0%,var(--roxo-claro) 100%);color:#fff;}
  .btn-sortear:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(75,45,139,.35);}
  .btn-disabled{background:#e5e0f0;color:#9b96b0;cursor:not-allowed;}
  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(26,21,37,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal{background:var(--branco);border-radius:20px;width:100%;max-width:460px;overflow:hidden;box-shadow:0 20px 60px rgba(75,45,139,.25);transform:scale(.95) translateY(20px);transition:transform .25s;}
  .modal-overlay.open .modal{transform:scale(1) translateY(0);}
  .modal-head{background:linear-gradient(135deg,var(--roxo) 0%,var(--roxo-claro) 100%);padding:24px 28px;color:#fff;}
  .modal-head h2{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;letter-spacing:.5px;}
  .modal-head p{font-size:13px;opacity:.8;margin-top:4px;}
  .modal-body{padding:28px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--texto-leve);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;}
  .field input{width:100%;padding:12px 16px;border:1.5px solid var(--cinza-borda);border-radius:10px;font-size:15px;font-family:'Inter',sans-serif;color:var(--texto);background:var(--branco);outline:none;transition:border-color .2s;}
  .field input:focus{border-color:var(--roxo-claro);box-shadow:0 0 0 3px rgba(75,45,139,.1);}
  .modal-premio-info{background:var(--roxo-bg);border-radius:10px;padding:14px 18px;margin-bottom:20px;}
  .mpi-label{font-size:11px;font-weight:700;color:var(--roxo);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .mpi-nome{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--roxo-escuro);}
  .modal-footer{display:flex;gap:12px;}
  .btn-cancelar{flex:1;background:var(--cinza-claro);color:var(--texto-leve);border:1px solid var(--cinza-borda);}
  .btn-confirmar{flex:2;background:linear-gradient(135deg,var(--verde) 0%,#18a36d 100%);color:#fff;}
  .btn-confirmar:hover{box-shadow:0 4px 14px rgba(29,183,125,.35);}
  .loader{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading .loader{display:inline-block;}
  .loading .btn-text{display:none;}
  #toast{position:fixed;bottom:24px;right:24px;background:#1a1525;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.25);transform:translateY(80px);opacity:0;transition:all .3s;z-index:999;display:flex;align-items:center;gap:10px;}
  #toast.show{transform:translateY(0);opacity:1;}
  #toast.success{background:var(--verde);}
  #toast.error{background:var(--vermelho);}
  .empty{text-align:center;padding:60px 20px;color:var(--texto-leve);}
  .empty-icon{font-size:52px;margin-bottom:16px;}
  .empty h3{font-size:18px;margin-bottom:8px;color:var(--texto);}
  .empty p{font-size:14px;}
  .refresh-btn{position:fixed;bottom:24px;left:24px;background:var(--roxo);color:#fff;border:none;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(75,45,139,.3);transition:all .2s;}
  .refresh-btn:hover{background:var(--roxo-escuro);}
</style>
</head>

  </div>
</div>

<button class="refresh-btn" onclick="carregarPremios()">🔄 Atualizar</button>
<div id="toast"><span id="toast-msg"></span></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz_e-kFZYuCLFwil6YGjhGDrD7bxite6pwGGWQH-14OSLuZI7MVoV4oUKrhtFLcEBE6VA/exec';
let premioAtual = null;

function getSemanaTexto(){
  const h=new Date(),s=new Date(h);
  s.setDate(h.getDate()-h.getDay()+1);
  const e=new Date(s);e.setDate(s.getDate()+4);
  const f=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
  document.getElementById('semana-texto').textContent=f(s)+' – '+f(e);
}
getSemanaTexto();

async function api(acao,dados={}){
  const p=new URLSearchParams({acao,...dados});
  const r=await fetch(API_URL+'?'+p);
  return r.json();
}
async function apiPost(acao,dados){
  // Apps Script nao suporta CORS em POST — usamos GET com params
  const p=new URLSearchParams({acao});
  Object.keys(dados).forEach(k=>p.append(k, dados[k]??''));
  const r=await fetch(API_URL+'?'+p);
  return r.json();
}

function toast(msg,tipo='success'){
  const el=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  el.className='show '+tipo;
  setTimeout(()=>el.className='',3500);
}

async function carregarPremios(){
  const grid=document.getElementById('grid-premios');
  grid.innerHTML='<div class="empty"><div class="empty-icon">⏳</div><h3>Carregando...</h3></div>';
  try{
    const r=await api('getPremiosSemana');
    if(!r.data||!r.data.length){
      grid.innerHTML='<div class="empty"><div class="empty-icon">🎁</div><h3>Nenhum prêmio cadastrado</h3><p>A secretaria ainda não cadastrou prêmios para esta semana.</p></div>';
      document.getElementById('contador-premios').textContent='0 prêmios';
      return;
    }
    const disp=r.data.filter(p=>p.status!=='Sorteado'&&p.status!=='Entregue').length;
    document.getElementById('contador-premios').textContent=`${disp} disponíve${disp===1?'l':'is'} · ${r.data.length} total`;
    grid.innerHTML=r.data.map(p=>{
      const isSorteado=p.status==='Sorteado'||p.status==='Entregue';
      const statusClass=isSorteado?'sorteado':'disponivel';
      const chipClass=p.status==='Sorteado'?'chip-sorteado':p.status==='Entregue'?'chip-entregue':'chip-disponivel';
      const statusTxt=p.status||'Disponível';
      const dataFmt=p.data?new Date(p.data+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',weekday:'short'}):'—';
      const ganhadorHtml=isSorteado?`<div class="cp-ganhador"><div class="cp-ganhador-label">🏆 Ganhador(a)</div><div class="cp-ganhador-nome">${p.ganhador_nome||'—'}</div><div class="cp-ganhador-tel">${p.ganhador_tel||''}</div></div>`:'';
      const btnHtml=isSorteado?`<button class="btn btn-disabled" disabled>✅ Já sorteado</button>`:`<button class="btn btn-sortear" onclick="abrirModal('${p.id}','${p.nome.replace(/'/g,"\'")}','${p.programa}')">🎲 Registrar Sorteio</button>`;
      return `<div class="card-premio ${statusClass}">
        <div class="cp-status-bar"></div>
        <div class="cp-head">
          <div class="cp-programa">${p.programa}</div>
          <div class="cp-nome">${p.nome}</div>
        </div>
        <div class="cp-body">
          <div class="cp-info">
            <div class="cp-row"><span class="cp-icon">🎙️</span><span>${p.locutor}</span></div>
            <div class="cp-row"><span class="cp-icon">📅</span><span>${dataFmt}</span></div>
            ${p.obs?`<div class="cp-row"><span class="cp-icon">📝</span><span>${p.obs}</span></div>`:''}
            <div class="cp-row"><span class="cp-icon">📌</span><span class="chip ${chipClass}">${statusTxt}</span></div>
          </div>
          ${ganhadorHtml}
          ${btnHtml}
        </div>
      </div>`;
    }).join('');
  }catch(e){
    grid.innerHTML='<div class="empty"><div class="empty-icon">❌</div><h3>Erro ao carregar</h3><p>Verifique a conexão e a URL da API</p></div>';
    console.error(e);
  }
}

function abrirModal(id,nome,programa){
  premioAtual={id,nome,programa};
  document.getElementById('modal-premio-nome').textContent=nome;
  document.getElementById('modal-premio-prog').textContent='📻 '+programa;
  document.getElementById('ganhador-nome').value='';
  document.getElementById('ganhador-tel').value='';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('ganhador-nome').focus(),300);
}

function fecharModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  premioAtual=null;
}

async function confirmarSorteio(){
  const nome=document.getElementById('ganhador-nome').value.trim();
  const tel=document.getElementById('ganhador-tel').value.trim();
  if(!nome||!tel)return toast('Preencha nome e telefone do ganhador','error');
  document.getElementById('btn-confirmar').classList.add('loading');
  try{
    const r=await apiPost('registrarGanhador',{id:premioAtual.id,ganhador_nome:nome,ganhador_tel:tel});
    if(r.ok){fecharModal();toast('🏆 Ganhador registrado com sucesso!');carregarPremios();}
    else toast(r.msg||'Erro ao registrar','error');
  }catch(e){toast('Erro de conexão','error');}
  document.getElementById('btn-confirmar').classList.remove('loading');
}

document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)fecharModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharModal();});

carregarPremios();
setInterval(carregarPremios, 60000);
</script>
</body>
</html>
