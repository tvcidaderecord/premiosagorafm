<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Ganhadores – Agora FM 92,5</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --roxo:#4B2D8B;--roxo-escuro:#351f63;--roxo-claro:#6B4DBF;
    --roxo-bg:#f4f0ff;--branco:#fff;--cinza-claro:#f7f7f9;
    --cinza-borda:#e2dff0;--texto:#1a1525;--texto-leve:#6b6580;
    --verde:#1db77d;--vermelho:#e53e3e;--amarelo:#f6ad0a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--cinza-claro);color:var(--texto);min-height:100vh;}
  .header{background:linear-gradient(135deg,var(--roxo-escuro) 0%,var(--roxo) 100%);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;box-shadow:0 2px 12px rgba(75,45,139,.3);position:sticky;top:0;z-index:100;}
  .header img{height:44px;}
  .header-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:1px;text-transform:uppercase;}
  .badge-consulta{background:rgba(255,255,255,.15);color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;}
  .main{max-width:900px;margin:0 auto;padding:36px 20px;}
  .search-hero{background:linear-gradient(135deg,var(--roxo) 0%,var(--roxo-claro) 100%);border-radius:20px;padding:36px 32px;margin-bottom:32px;color:#fff;box-shadow:0 8px 32px rgba(75,45,139,.25);}
  .search-hero h2{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;letter-spacing:.5px;margin-bottom:6px;}
  .search-hero p{font-size:14px;opacity:.8;margin-bottom:24px;}
  .search-box{display:flex;gap:12px;}
  .search-input{flex:1;padding:14px 18px;border-radius:10px;border:none;font-size:15px;font-family:'Inter',sans-serif;outline:none;color:var(--texto);}
  .search-input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.3);}
  .btn-buscar{background:#fff;color:var(--roxo);border:none;padding:14px 24px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;}
  .btn-buscar:hover{background:var(--roxo-bg);transform:translateY(-1px);}
  .filtros{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .filtro-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
  .filtro-btn:hover,.filtro-btn.active{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.6);}
  /* RESULTS */
  .result-count{font-size:14px;color:var(--texto-leve);margin-bottom:16px;font-weight:500;}
  .result-count strong{color:var(--texto);}
  .card-ganhador{background:var(--branco);border-radius:16px;border:1px solid var(--cinza-borda);overflow:hidden;box-shadow:0 2px 8px rgba(75,45,139,.06);margin-bottom:16px;transition:transform .2s,box-shadow .2s;}
  .card-ganhador:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(75,45,139,.1);}
  .cg-top{padding:18px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .cg-info{flex:1;}
  .cg-programa{font-size:11px;font-weight:700;color:var(--roxo);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .cg-premio{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--texto);line-height:1.2;margin-bottom:10px;}
  .cg-meta{display:flex;flex-wrap:wrap;gap:16px;}
  .cg-meta-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--texto-leve);}
  .cg-meta-item span{font-weight:600;color:var(--texto);}
  .cg-ganhador{background:var(--roxo-bg);border-left:4px solid var(--roxo);padding:14px 20px 14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .cg-ganhador-info .cg-label{font-size:11px;font-weight:700;color:var(--roxo);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
  .cg-ganhador-info .cg-nome{font-size:17px;font-weight:700;color:var(--texto);}
  .cg-ganhador-info .cg-tel{font-size:13px;color:var(--texto-leve);margin-top:2px;}
  .chip{display:inline-block;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;}
  .chip-pendente{background:#fff8e1;color:#b37700;}
  .chip-entregue{background:#e8fdf4;color:#1a8a5a;}
  .chip-sorteado{background:var(--roxo-bg);color:var(--roxo);}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;}
  .btn-entregar{background:var(--verde);color:#fff;}
  .btn-entregar:hover{background:#18a36d;box-shadow:0 4px 12px rgba(29,183,125,.3);}
  .btn-ja-entregue{background:#e8fdf4;color:#1a8a5a;cursor:default;}
  #toast{position:fixed;bottom:24px;right:24px;background:#1a1525;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.25);transform:translateY(80px);opacity:0;transition:all .3s;z-index:999;}
  #toast.show{transform:translateY(0);opacity:1;}
  #toast.success{background:var(--verde);}
  #toast.error{background:var(--vermelho);}
  .loader-overlay{display:none;text-align:center;padding:40px;color:var(--texto-leve);}
  .loader-overlay.show{display:block;}
  .spin{display:inline-block;width:32px;height:32px;border:3px solid var(--cinza-borda);border-top-color:var(--roxo);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{text-align:center;padding:60px 20px;color:var(--texto-leve);}
  .empty-icon{font-size:52px;margin-bottom:16px;}
  .empty h3{font-size:18px;margin-bottom:8px;color:var(--texto);}
  .empty p{font-size:14px;}
  /* MODAL CONFIRMAR */
  .modal-overlay{position:fixed;inset:0;background:rgba(26,21,37,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal{background:var(--branco);border-radius:20px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 20px 60px rgba(75,45,139,.25);transform:scale(.95);transition:transform .25s;}
  .modal-overlay.open .modal{transform:scale(1);}
  .modal-head{background:linear-gradient(135deg,var(--verde) 0%,#18a36d 100%);padding:24px 28px;color:#fff;}
  .modal-head h2{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;}
  .modal-head p{font-size:13px;opacity:.85;margin-top:4px;}
  .modal-body{padding:28px;}
  .confirm-info{background:var(--cinza-claro);border-radius:12px;padding:16px 20px;margin-bottom:20px;}
  .confirm-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
  .confirm-row:last-child{margin-bottom:0;}
  .confirm-row .cl{color:var(--texto-leve);}
  .confirm-row .cv{font-weight:600;text-align:right;}
  .modal-footer{display:flex;gap:12px;}
  .btn-cancelar{flex:1;background:var(--cinza-claro);color:var(--texto-leve);border:1px solid var(--cinza-borda);justify-content:center;}
  .btn-confirmar-verde{flex:2;background:linear-gradient(135deg,var(--verde) 0%,#18a36d 100%);color:#fff;justify-content:center;}
  .loader-sm{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  .loading .loader-sm{display:inline-block;}
  .loading .btn-text{display:none;}
</style>
</head>

</div>

<div id="toast"><span id="toast-msg"></span></div>

<script>
const API_URL = 'SUA_URL_DO_APPS_SCRIPT_AQUI';
let todosGanhadores = [];
let filtroAtual = 'todos';
let entregaAtualId = null;
let entregaAtualDados = null;

function toast(msg,tipo='success'){
  const el=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  el.className='show '+tipo;
  setTimeout(()=>el.className='',3500);
}

async function api(acao,dados={}){
  const p=new URLSearchParams({acao,...dados});
  const r=await fetch(API_URL+'?'+p);
  return r.json();
}
async function apiPost(acao,dados){
  // Apps Script nao suporta CORS em POST — usamos GET com params
  const p=new URLSearchParams({acao});
  Object.keys(dados).forEach(k=>p.append(k, dados[k]??''));
  const r=await fetch(API_URL+'?'+p);
  return r.json();
}

function setFiltro(f,btn){
  filtroAtual=f;
  document.querySelectorAll('.filtro-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderizar();
}

function renderizar(){
  const busca=document.getElementById('busca-input').value.toLowerCase().trim();
  let dados=todosGanhadores;
  if(busca)dados=dados.filter(g=>(g.ganhador_nome||'').toLowerCase().includes(busca));
  if(filtroAtual==='pendente')dados=dados.filter(g=>g.status==='Sorteado');
  if(filtroAtual==='entregue')dados=dados.filter(g=>g.status==='Entregue');
  
  const rc=document.getElementById('result-count');
  rc.style.display='block';
  rc.innerHTML=`Exibindo <strong>${dados.length}</strong> resultado${dados.length!==1?'s':''}`;
  
  const lista=document.getElementById('lista-ganhadores');
  if(!dados.length){
    lista.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><h3>Nenhum resultado</h3><p>Tente outro nome ou ajuste os filtros</p></div>';
    return;
  }
  lista.innerHTML=dados.map(g=>{
    const dataFmt=g.data?new Date(g.data+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}):'—';
    const entregue=g.status==='Entregue';
    const chipClass=entregue?'chip-entregue':'chip-sorteado';
    const chipTxt=entregue?'✅ Entregue':'⏳ Aguardando Retirada';
    const btnHtml=entregue?`<button class="btn btn-ja-entregue">✅ Já Entregue</button>`:`<button class="btn btn-entregar" onclick="abrirModalEntrega('${g.id}','${(g.nome||'').replace(/'/g,"\'")}','${(g.ganhador_nome||'').replace(/'/g,"\'")}','${g.ganhador_tel||''}','${g.programa||''}')">📦 Confirmar Retirada</button>`;
    return `<div class="card-ganhador">
      <div class="cg-top">
        <div class="cg-info">
          <div class="cg-programa">${g.programa||'—'}</div>
          <div class="cg-premio">${g.nome}</div>
          <div class="cg-meta">
            <div class="cg-meta-item">🎙️ <span>${g.locutor||'—'}</span></div>
            <div class="cg-meta-item">📅 <span>${dataFmt}</span></div>
          </div>
        </div>
        <span class="chip ${chipClass}">${chipTxt}</span>
      </div>
      <div class="cg-ganhador">
        <div class="cg-ganhador-info">
          <div class="cg-label">🏆 Ganhador(a)</div>
          <div class="cg-nome">${g.ganhador_nome||'—'}</div>
          <div class="cg-tel">${g.ganhador_tel||''}</div>
        </div>
        ${btnHtml}
      </div>
    </div>`;
  }).join('');
}

async function carregarGanhadores(){
  document.getElementById('loader-area').classList.add('show');
  document.getElementById('lista-ganhadores').innerHTML='';
  document.getElementById('result-count').style.display='none';
  try{
    const r=await api('getGanhadores');
    todosGanhadores=r.data||[];
    document.getElementById('loader-area').classList.remove('show');
    renderizar();
  }catch(e){
    document.getElementById('loader-area').innerHTML='<div class="empty"><div class="empty-icon">❌</div><h3>Erro ao carregar</h3><p>Verifique a conexão</p></div>';
    console.error(e);
  }
}

function buscar(){renderizar();}

function abrirModalEntrega(id,premio,ganhadorNome,ganhadorTel,programa){
  entregaAtualId=id;
  entregaAtualDados={premio,ganhadorNome,ganhadorTel,programa};
  document.getElementById('confirm-info').innerHTML=`
    <div class="confirm-row"><span class="cl">Programa</span><span class="cv">${programa}</span></div>
    <div class="confirm-row"><span class="cl">Prêmio</span><span class="cv">${premio}</span></div>
    <div class="confirm-row"><span class="cl">Ganhador(a)</span><span class="cv">${ganhadorNome}</span></div>
    <div class="confirm-row"><span class="cl">Telefone</span><span class="cv">${ganhadorTel||'—'}</span></div>
  `;
  document.getElementById('modal-entrega').classList.add('open');
}

function fecharModal(){
  document.getElementById('modal-entrega').classList.remove('open');
  entregaAtualId=null;
}

async function confirmarEntrega(){
  if(!entregaAtualId)return;
  document.getElementById('btn-confirmar-entrega').classList.add('loading');
  try{
    const r=await apiPost('confirmarEntrega',{id:entregaAtualId});
    if(r.ok){
      fecharModal();
      toast('📦 Retirada confirmada com sucesso!');
      carregarGanhadores();
    }else toast(r.msg||'Erro','error');
  }catch(e){toast('Erro de conexão','error');}
  document.getElementById('btn-confirmar-entrega').classList.remove('loading');
}

document.getElementById('modal-entrega').addEventListener('click',function(e){if(e.target===this)fecharModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharModal();});

carregarGanhadores();
</script>
</body>
</html>
